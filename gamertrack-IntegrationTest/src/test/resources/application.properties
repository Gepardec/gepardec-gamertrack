quarkus.http.root-path=/gepardec-gamertrack/

# Datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Test values for the secrets. Real environment variables
# (SECRET_ADMIN_NAME, SECRET_DEFAULT_PW, SECRET_JWT_HASH,
# ALLOWED_ORIGINS_AS_REGEX) still take precedence when set.
allowed.origins.as.regex=^(http|https)://gamertrack-frontend.apps.cloudscale-lpg-2.appuio.cloud
secret.default.pw=admin@gamertrack
secret.jwt.hash=1b6f8c8c2a3d4e5f60718293a4b5c6d7e8f90123456789abcdef0123456789abcdef0123456789abcdef0123456789ab
secret.admin.name=admin
