quarkus.http.root-path=/gepardec-gamertrack/

# Datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Secrets provided via environment variables or a .env file
# in the working directory the application is started from
# (dev mode runs from the project root, see workingDir in pom.xml)
allowed.origins.as.regex=${ALLOWED_ORIGINS_AS_REGEX}
secret.default.pw=${SECRET_DEFAULT_PW}
secret.jwt.hash=${SECRET_JWT_HASH}
secret.admin.name=${SECRET_ADMIN_NAME}
